<!--
  Favicons built from tools/favicons/ (claude-md/ui-style-prd.md 12-3).
  Small sizes show "K", the home-screen icon shows "KTW"; favicon.svg follows the OS light/dark mode.
  The ?v= query makes browsers fetch the new set when the icon changes.
-->

{% capture favicon_path %}{{ '/assets/img/favicons' | relative_url }}{% endcapture %}
{% capture v %}?v={{ site.version }}{% endcapture %}

<link rel="icon" href="{{ favicon_path }}/favicon.ico{{ v }}" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="{{ favicon_path }}/favicon.svg{{ v }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/apple-touch-icon.png{{ v }}">
{% if site.pwa.enabled %}
  <link rel="manifest" href="{{ favicon_path }}/site.webmanifest">
{% endif %}
<meta name="apple-mobile-web-app-title" content="{{ site.title }}">
<meta name="application-name" content="{{ site.title }}">
