<!--
  The '⋯' panel (claude-md/ui-style-prd.md 7-2).
  It keeps the #sidebar id so the bundled JS still finds it; it opens as a popover from #sidebar-trigger.
-->

<div id="sidebar" popover aria-label="화면 설정과 연결 링크">
  {% unless site.theme_mode %}
    <section class="panel-group">
      <h2 class="panel-group-title" aria-hidden="true">화면</h2>
      <fieldset id="mode-toggle" class="theme-switch">
        <legend class="theme-switch-legend">테마</legend>
        <label class="theme-switch-option">
          <input type="radio" name="theme-mode" value="light" autocomplete="off">
          <i class="fas fa-sun" aria-hidden="true"></i>
          <span>라이트</span>
        </label>
        <label class="theme-switch-option">
          <input type="radio" name="theme-mode" value="dark" autocomplete="off">
          <i class="fas fa-moon" aria-hidden="true"></i>
          <span>다크</span>
        </label>
        <label class="theme-switch-option">
          <input type="radio" name="theme-mode" value="system" autocomplete="off" checked>
          <i class="fas fa-desktop" aria-hidden="true"></i>
          <span>시스템</span>
        </label>
      </fieldset>
    </section>
  {% endunless %}

  {% if site.data.contact.size > 0 %}
    <section class="panel-group">
      <h2 class="panel-group-title">연결</h2>
      <ul class="panel-links">
        {% include contact-links.html variant='panel' %}
      </ul>
    </section>
  {% endif %}
</div>
