<!-- The floating bar (claude-md/ui-style-prd.md 7-1) -->

{% assign home_url = '/' | relative_url %}
{% assign archives_url = '/archives/' | relative_url %}
{% assign about_url = '/about/' | relative_url %}

<header id="topbar-wrapper" aria-label="Top Bar">
  <div id="topbar">
    <a class="bar-mark" href="{{ home_url }}" aria-label="{{ site.title }} 홈">
      <span aria-hidden="true">KTW</span>
    </a>

    <nav class="bar-nav" aria-label="주 메뉴">
      <a class="bar-link" href="{{ home_url }}" {% if page.layout == 'home' %}aria-current="page"{% endif %}>홈</a>
      <a class="bar-link" href="{{ archives_url }}" {% if page.url == '/archives/' %}aria-current="page"{% endif %}>기록</a>
      <a class="bar-link" href="{{ about_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>

    <div id="topbar-title" class="sr-only">
      {%- if page.layout == 'home' -%}
        {{- site.title -}}
      {%- else -%}
        {{- page.title | default: site.title -}}
      {%- endif -%}
    </div>

    <button type="button" id="search-trigger" class="bar-btn" aria-label="검색">
      <i class="fas fa-search fa-fw" aria-hidden="true"></i>
    </button>

    <search id="search">
      <i class="fas fa-search fa-fw" aria-hidden="true"></i>
      <input
        class="form-control"
        id="search-input"
        type="search"
        aria-label="검색어"
        autocomplete="off"
        placeholder="{{ site.data.locales[include.lang].search.hint | capitalize }}..."
      >
    </search>
    <button type="button" class="btn btn-link text-decoration-none" id="search-cancel">
      {{- site.data.locales[include.lang].search.cancel -}}
    </button>

    <button
      type="button"
      id="sidebar-trigger"
      class="bar-btn"
      popovertarget="sidebar"
      aria-label="화면 설정과 연결 링크"
    >
      <i class="fas fa-ellipsis fa-fw" aria-hidden="true"></i>
    </button>
  </div>
</header>
