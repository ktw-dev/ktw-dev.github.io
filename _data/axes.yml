# 블로그의 최상위 분류(축). 글의 categories 첫 칸이 아래 name과 같아야 한다.
# 글이 0편인 축은 기록 목록과 필터에서 숨기고, About에서는 링크 없이 텍스트로만 보여 준다.
# intro는 About 페이지의 「이 블로그에서 다루는 것」 문장과 맞춘다.

- id: ai-tools
  name: AI 툴 활용
  intro: Claude, Codex 같은 AI 도구로 실제로 어떤 작업을 시도했고, 그 도구를 어떻게 활용했는지 기록했다.

- id: game-dev
  name: 게임 개발
  intro: 취미로 만드는 게임의 개발 과정을 기록했다. 잘된 시도와 실패한 시도를 가리지 않고 그대로 남겼다.

- id: dev-notes
  name: 개발 노트
  intro: 블로그 구축부터 소소한 개발 팁까지, 작업하면서 배운 것들을 정리했다.
